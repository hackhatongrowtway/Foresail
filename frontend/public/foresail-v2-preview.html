<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foresail — Auth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet" />
  <style>
    /* ═══════════════════════════════════════════════
       DESIGN TOKENS
    ═══════════════════════════════════════════════ */
    :root {
      --blue:        #1B4DFF;
      --blue-hover:  #1440e0;
      --teal:        #00E5A0;
      --teal-dim:    rgba(0,229,160,0.15);
      --blue-dim:    rgba(27,77,255,0.12);
    }

    [data-theme='dark'] {
      --bg:          #080a0f;
      --bg2:         #0e1118;
      --surface:     #13161f;
      --surface2:    #1a1e2a;
      --surface3:    #222736;
      --border:      #1e2433;
      --border2:     #2a3147;
      --text:        #e8ecf5;
      --text2:       #7a84a0;
      --text3:       #3d4560;
      --accent:      #3d6bff;
      --accent-h:    #5579ff;
      --focus:       rgba(61,107,255,0.18);
      --err:         #f47070;
      --err-bg:      rgba(244,112,112,0.08);
      --err-bd:      rgba(244,112,112,0.25);
      --shadow:      0 8px 40px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.35);
      --shadow-sm:   0 2px 12px rgba(0,0,0,0.4);
    }

    [data-theme='light'] {
      --bg:          #f0f2f7;
      --bg2:         #e8eaf2;
      --surface:     #ffffff;
      --surface2:    #f7f8fc;
      --surface3:    #eef0f6;
      --border:      #dde0ec;
      --border2:     #c8ccdc;
      --text:        #0d1020;
      --text2:       #555e7a;
      --text3:       #aab0c8;
      --accent:      #1B4DFF;
      --accent-h:    #1440e0;
      --focus:       rgba(27,77,255,0.14);
      --err:         #d63b3b;
      --err-bg:      rgba(214,59,59,0.06);
      --err-bd:      rgba(214,59,59,0.2);
      --shadow:      0 8px 40px rgba(12,18,60,0.1), 0 2px 8px rgba(12,18,60,0.06);
      --shadow-sm:   0 2px 12px rgba(12,18,60,0.08);
    }

    /* ═══════════════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: background .35s ease, color .35s ease;
    }

    button, input { font-family: inherit; }
    button { cursor: pointer; }

    input:-webkit-autofill,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--text) !important;
      -webkit-box-shadow: 0 0 0 1000px var(--surface2) inset !important;
    }

    /* ═══════════════════════════════════════════════
       CANVAS BACKGROUND
    ═══════════════════════════════════════════════ */
    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* ═══════════════════════════════════════════════
       FLOATING GRID LINES
    ═══════════════════════════════════════════════ */
    .grid-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      opacity: 0.025;
    }

    [data-theme='light'] .grid-lines { opacity: 0.04; }

    .grid-lines::before {
      content: '';
      position: absolute;
      inset: -50%;
      background-image:
        linear-gradient(var(--blue) 1px, transparent 1px),
        linear-gradient(90deg, var(--blue) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridDrift 25s linear infinite;
    }

    @keyframes gridDrift {
      from { transform: translate(0,0); }
      to   { transform: translate(60px,60px); }
    }

    /* ═══════════════════════════════════════════════
       GLOW ORBS
    ═══════════════════════════════════════════════ */
    .orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(80px);
      will-change: transform;
    }

    .orb-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(27,77,255,0.22) 0%, transparent 70%);
      top: -200px; right: -150px;
      animation: orbFloat1 18s ease-in-out infinite;
    }

    .orb-2 {
      width: 450px; height: 450px;
      background: radial-gradient(circle, rgba(0,229,160,0.16) 0%, transparent 70%);
      bottom: -150px; left: -100px;
      animation: orbFloat2 22s ease-in-out infinite;
    }

    .orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(27,77,255,0.1) 0%, transparent 70%);
      top: 40%; left: 30%;
      animation: orbFloat3 28s ease-in-out infinite;
    }

    [data-theme='light'] .orb-1 { background: radial-gradient(circle, rgba(27,77,255,0.12) 0%, transparent 70%); }
    [data-theme='light'] .orb-2 { background: radial-gradient(circle, rgba(0,229,160,0.1) 0%, transparent 70%); }
    [data-theme='light'] .orb-3 { background: radial-gradient(circle, rgba(27,77,255,0.07) 0%, transparent 70%); }

    @keyframes orbFloat1 {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(-60px,40px) scale(1.08); }
      66%      { transform: translate(40px,-30px) scale(0.95); }
    }

    @keyframes orbFloat2 {
      0%,100% { transform: translate(0,0) scale(1); }
      40%      { transform: translate(70px,-50px) scale(1.12); }
      70%      { transform: translate(-40px,30px) scale(0.92); }
    }

    @keyframes orbFloat3 {
      0%,100% { transform: translate(0,0) scale(1); opacity: 0.6; }
      50%      { transform: translate(-80px,60px) scale(1.2); opacity: 1; }
    }

    /* ═══════════════════════════════════════════════
       FLOATING GEOMETRIC SHAPES
    ═══════════════════════════════════════════════ */
    .geo {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      animation: geoFadeIn .8s ease forwards;
    }

    .geo svg { display: block; }

    @keyframes geoFadeIn { to { opacity: 1; } }

    /* ═══════════════════════════════════════════════
       THEME TOGGLE
    ═══════════════════════════════════════════════ */
    .theme-btn {
      position: fixed;
      top: 20px; right: 20px;
      z-index: 200;
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1.5px solid var(--border2);
      background: var(--surface);
      color: var(--text2);
      display: flex; align-items: center; justify-content: center;
      transition: border-color .2s, color .2s, background .2s, transform .2s;
      box-shadow: var(--shadow-sm);
    }

    .theme-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: rotate(20deg) scale(1.08);
    }

    /* ═══════════════════════════════════════════════
       PAGE WRAPPER & TRANSITIONS
    ═══════════════════════════════════════════════ */
    #app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      perspective: 1200px;
    }

    .page-view {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Transition states */
    .page-exit {
      animation: pageOut .38s cubic-bezier(.4,0,1,1) forwards;
    }

    .page-enter {
      animation: pageIn .45s cubic-bezier(0,.8,.2,1) both;
    }

    @keyframes pageOut {
      from { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
      to   { opacity: 0; transform: translateX(-40px) scale(0.97); filter: blur(4px); }
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateX(40px) scale(0.97); filter: blur(4px); }
      to   { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
    }

    @keyframes pageOutRight {
      from { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
      to   { opacity: 0; transform: translateX(40px) scale(0.97); filter: blur(4px); }
    }

    @keyframes pageInLeft {
      from { opacity: 0; transform: translateX(-40px) scale(0.97); filter: blur(4px); }
      to   { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
    }

    .page-exit-right { animation: pageOutRight .38s cubic-bezier(.4,0,1,1) forwards; }
    .page-enter-left { animation: pageInLeft .45s cubic-bezier(0,.8,.2,1) both; }

    /* ═══════════════════════════════════════════════
       CARD
    ═══════════════════════════════════════════════ */
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 40px 36px 36px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    /* Subtle shimmer border at top */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--teal), transparent);
      opacity: 0.5;
      animation: shimmer 4s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%,100% { opacity: 0.3; left: 10%; right: 10%; }
      50%      { opacity: 0.7; left: 5%; right: 5%; }
    }

    /* ═══════════════════════════════════════════════
       BRAND
    ═══════════════════════════════════════════════ */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .brand-mark {
      animation: brandPulse 3s ease-in-out infinite;
    }

    @keyframes brandPulse {
      0%,100% { filter: drop-shadow(0 0 0px transparent); }
      50%      { filter: drop-shadow(0 0 6px rgba(0,229,160,0.5)); }
    }

    .brand-name {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -.04em;
    }

    /* ═══════════════════════════════════════════════
       CARD HEADER
    ═══════════════════════════════════════════════ */
    .card-header { margin-bottom: 24px; }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -.03em;
      margin-bottom: 4px;
    }

    .card-sub {
      font-size: 13.5px;
      color: var(--text2);
    }

    /* ═══════════════════════════════════════════════
       FORM
    ═══════════════════════════════════════════════ */
    .form { display: flex; flex-direction: column; gap: 15px; }

    .field { display: flex; flex-direction: column; gap: 5px; }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .lbl {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text2);
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    .input-wrap { position: relative; }

    .inp {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border-radius: 11px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s, transform .15s;
    }

    .inp::placeholder { color: var(--text3); }

    .inp:focus {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 3.5px var(--focus);
      transform: translateY(-1px);
    }

    .inp.err { border-color: var(--err); }
    .inp.err:focus { box-shadow: 0 0 0 3.5px var(--err-bg); }

    .inp-pw { padding-right: 46px; }

    .eye-btn {
      position: absolute;
      right: 13px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--text3);
      display: flex; align-items: center;
      transition: color .15s;
      padding: 0;
    }
    .eye-btn:hover { color: var(--text2); }

    .field-err {
      font-size: 11.5px;
      color: var(--err);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Password strength bar */
    .pw-strength {
      height: 3px;
      border-radius: 2px;
      background: var(--border);
      overflow: hidden;
      margin-top: 4px;
      transition: opacity .2s;
    }

    .pw-strength-fill {
      height: 100%;
      border-radius: 2px;
      transition: width .4s ease, background .4s ease;
    }

    /* Error banner */
    .api-err {
      background: var(--err-bg);
      border: 1px solid var(--err-bd);
      color: var(--err);
      border-radius: 9px;
      padding: 10px 14px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      animation: errShake .4s ease;
    }

    @keyframes errShake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      60%      { transform: translateX(4px); }
    }

    .api-err button {
      background: none; border: none;
      color: var(--err); font-size: 18px;
      opacity: .6; padding: 0; line-height: 1;
    }
    .api-err button:hover { opacity: 1; }

    /* Forgot */
    .forgot {
      background: none; border: none;
      font-size: 12px; color: var(--accent);
      transition: opacity .15s; padding: 0;
    }
    .forgot:hover { opacity: .7; }

    /* Submit */
    .submit-btn {
      width: 100%; height: 46px;
      border-radius: 11px; border: none;
      background: var(--accent);
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: .02em;
      display: flex; align-items: center; justify-content: center;
      margin-top: 4px;
      position: relative;
      overflow: hidden;
      transition: background .2s, transform .15s, opacity .2s, box-shadow .2s;
    }

    .submit-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
      pointer-events: none;
    }

    .submit-btn:hover:not(:disabled) {
      background: var(--accent-h);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(27,77,255,0.4);
    }

    .submit-btn:active:not(:disabled) { transform: translateY(0); }
    .submit-btn:disabled { opacity: .65; cursor: not-allowed; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .65s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ═══════════════════════════════════════════════
       DIVIDER
    ═══════════════════════════════════════════════ */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
    }

    .div-line { flex: 1; height: 1px; background: var(--border); }

    .div-text {
      font-size: 11px;
      color: var(--text3);
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ═══════════════════════════════════════════════
       SOCIAL BUTTONS
    ═══════════════════════════════════════════════ */
    .social-btns { display: flex; flex-direction: column; gap: 10px; }

    .social-btn {
      display: flex; align-items: center; justify-content: center;
      gap: 10px;
      width: 100%; height: 44px;
      border-radius: 11px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: .01em;
      transition: background .22s, color .22s, border-color .22s, transform .15s, box-shadow .22s;
    }

    .social-btn:hover { transform: translateY(-2px); }
    .social-btn:active { transform: translateY(0); }

    .social-btn--google:hover {
      background: #1a73e8;
      border-color: #1a73e8;
      color: #fff;
      box-shadow: 0 4px 16px rgba(26,115,232,0.4);
    }

    .social-btn--github:hover {
      background: #161b22;
      border-color: #161b22;
      color: #fff;
      box-shadow: 0 4px 16px rgba(22,27,34,0.45);
    }

    [data-theme='dark'] .social-btn--github:hover { background: #24292f; border-color: #24292f; }

    /* ═══════════════════════════════════════════════
       FOOTER LINK
    ═══════════════════════════════════════════════ */
    .card-foot {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--text2);
    }

    .card-foot button {
      background: none; border: none;
      color: var(--accent);
      font-size: 13px; font-weight: 600;
      transition: opacity .15s;
    }
    .card-foot button:hover { opacity: .7; }

    /* ═══════════════════════════════════════════════
       SUCCESS STATE
    ═══════════════════════════════════════════════ */
    .success-overlay {
      position: absolute;
      inset: 0;
      background: var(--surface);
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
      animation: fadeInScale .4s ease both;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    .success-icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--teal-dim);
      border: 2px solid var(--teal);
      display: flex; align-items: center; justify-content: center;
      color: var(--teal);
      animation: successPop .5s cubic-bezier(0,.8,.2,1) .1s both;
    }

    @keyframes successPop {
      from { transform: scale(0) rotate(-20deg); }
      to   { transform: scale(1) rotate(0); }
    }

    .success-title {
      font-family: 'Syne', sans-serif;
      font-size: 18px; font-weight: 700;
      color: var(--text);
    }

    .success-sub { font-size: 13px; color: var(--text2); }

    /* ═══════════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════════ */
    @media (max-width: 440px) {
      .card { padding: 32px 22px 28px; border-radius: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
    }
  </style>
</head>
<body data-theme="dark">

  <!-- Animated background layers -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid-lines"></div>
  <canvas id="bg-canvas"></canvas>

  <!-- Theme toggle -->
  <button class="theme-btn" id="themeBtn" aria-label="Alternar tema"></button>

  <!-- App root -->
  <div id="app">
    <div class="page-view" id="pageView"></div>
  </div>

  <script>
  // ═══════════════════════════════════════════════
  // CANVAS PARTICLES
  // ═══════════════════════════════════════════════
  (function initCanvas() {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, particles = [], lines = [], frame;

    const COLORS = ['rgba(27,77,255,', 'rgba(0,229,160,', 'rgba(61,107,255,'];

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function Particle() {
      this.reset();
    }

    Particle.prototype.reset = function() {
      this.x  = Math.random() * W;
      this.y  = Math.random() * H;
      this.vx = (Math.random() - .5) * .4;
      this.vy = (Math.random() - .5) * .4;
      this.r  = Math.random() * 1.8 + .4;
      this.a  = Math.random() * .5 + .1;
      this.c  = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.life = Math.random() * 200 + 100;
      this.age  = 0;
      this.fadeIn = 40;
    };

    Particle.prototype.draw = function() {
      const progress = this.age / this.life;
      const fade = this.age < this.fadeIn
        ? this.age / this.fadeIn
        : this.age > this.life - this.fadeIn
          ? (this.life - this.age) / this.fadeIn
          : 1;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = this.c + (this.a * fade) + ')';
      ctx.fill();
    };

    Particle.prototype.update = function() {
      this.x += this.vx;
      this.y += this.vy;
      this.age++;
      if (this.age > this.life) this.reset();
      if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.reset();
    };

    // Create geometric floating shapes
    function createGeos() {
      document.querySelectorAll('.geo').forEach(e => e.remove());
      const shapes = [
        { type: 'hex', size: 60, x: '12%', y: '20%', delay: 0, dur: 20 },
        { type: 'hex', size: 36, x: '80%', y: '65%', delay: 2, dur: 24 },
        { type: 'diamond', size: 28, x: '88%', y: '18%', delay: 1, dur: 18 },
        { type: 'diamond', size: 18, x: '6%',  y: '72%', delay: 3, dur: 22 },
        { type: 'circle', size: 40, x: '92%', y: '42%', delay: 1.5, dur: 26 },
        { type: 'line',   size: 80, x: '5%',  y: '45%', delay: .5, dur: 15 },
      ];

      const theme = document.body.getAttribute('data-theme');
      const stroke = theme === 'dark' ? 'rgba(27,77,255,0.18)' : 'rgba(27,77,255,0.12)';
      const strokeTeal = theme === 'dark' ? 'rgba(0,229,160,0.15)' : 'rgba(0,200,140,0.1)';

      shapes.forEach(s => {
        const div = document.createElement('div');
        div.className = 'geo';
        div.style.cssText = `left:${s.x}; top:${s.y}; animation-delay:${s.delay}s;`;

        let svg = '';
        const c = Math.random() > .5 ? stroke : strokeTeal;

        if (s.type === 'hex') {
          const r = s.size / 2;
          const pts = Array.from({length:6}, (_,i) => {
            const a = (Math.PI/3)*i - Math.PI/6;
            return `${r + r*Math.cos(a)},${r + r*Math.sin(a)}`;
          }).join(' ');
          svg = `<svg width="${s.size}" height="${s.size}" viewBox="0 0 ${s.size} ${s.size}"><polygon points="${pts}" fill="none" stroke="${c}" stroke-width="1"/></svg>`;
        } else if (s.type === 'diamond') {
          const h = s.size, w = s.size;
          svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polygon points="${w/2},0 ${w},${h/2} ${w/2},${h} 0,${h/2}" fill="none" stroke="${c}" stroke-width="1"/></svg>`;
        } else if (s.type === 'circle') {
          svg = `<svg width="${s.size}" height="${s.size}" viewBox="0 0 ${s.size} ${s.size}"><circle cx="${s.size/2}" cy="${s.size/2}" r="${s.size/2-2}" fill="none" stroke="${c}" stroke-width="1" stroke-dasharray="4 3"/></svg>`;
        } else {
          svg = `<svg width="${s.size}" height="2" viewBox="0 0 ${s.size} 2"><line x1="0" y1="1" x2="${s.size}" y2="1" stroke="${c}" stroke-width="1" stroke-dasharray="6 4"/></svg>`;
        }

        div.innerHTML = svg;

        // Each shape gets its own drift animation
        const kf = `geo${Math.random().toString(36).slice(2)}`;
        const dx = (Math.random()-0.5)*50, dy = (Math.random()-0.5)*50, rot = (Math.random()-0.5)*30;
        const styleEl = document.createElement('style');
        styleEl.textContent = `@keyframes ${kf} { 0%,100%{transform:translate(0,0) rotate(0deg)} 50%{transform:translate(${dx}px,${dy}px) rotate(${rot}deg)} }`;
        document.head.appendChild(styleEl);
        div.querySelector('svg').style.animation = `${kf} ${s.dur}s ease-in-out infinite`;
        document.body.appendChild(div);
      });
    }

    function loop() {
      ctx.clearRect(0, 0, W, H);
      particles.forEach(p => { p.update(); p.draw(); });
      // Draw subtle connecting lines between nearby particles
      for (let i = 0; i < particles.length; i++) {
        for (let j = i+1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const d = Math.sqrt(dx*dx + dy*dy);
          if (d < 120) {
            const alpha = (1 - d/120) * 0.04;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(27,77,255,${alpha})`;
            ctx.lineWidth = .5;
            ctx.stroke();
          }
        }
      }
      frame = requestAnimationFrame(loop);
    }

    function init() {
      resize();
      particles = Array.from({length: 55}, () => new Particle());
      createGeos();
      loop();
    }

    window.addEventListener('resize', () => {
      resize();
      particles.forEach(p => p.reset());
    });

    init();
    window.refreshGeos = createGeos;
  })();

  const CHECK_ICON=`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
  const BRAND_MARK=`<svg width="28" height="32" viewBox="0 0 28 32" fill="none" class="brand-mark"><rect x="0" y="0" width="28" height="9" rx="4.5" fill="#1B4DFF"/><rect x="0" y="12" width="20" height="9" rx="4.5" fill="#1B4DFF"/><circle cx="6" cy="26" r="6" fill="#00E5A0"/></svg>`;

  const THEME_KEY = 'foresail_theme';

  function getTheme() {
    const s = localStorage.getItem(THEME_KEY);
    if (s) return s;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function applyTheme(t) {
    document.body.setAttribute('data-theme', t);
    document.getElementById('themeBtn').innerHTML = t === 'dark' ? MOON : SUN;
    localStorage.setItem(THEME_KEY, t);
    setTimeout(() => window.refreshGeos?.(), 50);
  }

  document.getElementById('themeBtn').addEventListener('click', () => {
    applyTheme(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  applyTheme(getTheme());

  // ═══════════════════════════════════════════════
  // ROUTER — simple SPA with animated transitions
  // ═══════════════════════════════════════════════
  let currentPage = 'login';

  function navigate(to) {
    if (to === currentPage) return;
    const view = document.getElementById('pageView');
    const exitClass = to === 'register' ? 'page-exit' : 'page-exit-right';
    const enterClass = to === 'register' ? 'page-enter' : 'page-enter-left';

    view.classList.add(exitClass);

    setTimeout(() => {
      view.classList.remove(exitClass);
      currentPage = to;
      renderPage(to);
      view.classList.add(enterClass);
      setTimeout(() => view.classList.remove(enterClass), 500);
    }, 360);
  }

  function renderPage(page) {
    const view = document.getElementById('pageView');
    if (page === 'login') view.innerHTML = renderLogin();
    else view.innerHTML = renderRegister();
    bindEvents(page);
  }

  // ═══════════════════════════════════════════════
  // EVENT BINDING
  // ═══════════════════════════════════════════════
  function bindEvents(page) {
    if (page === 'login') {
      bindEyeToggle('eyeBtn', 'password');
      document.getElementById('loginForm').addEventListener('submit', handleLogin);
      document.getElementById('email').addEventListener('input', () => clearErr('email','emailErr'));
      document.getElementById('password').addEventListener('input', () => clearErr('password','pwErr'));
    } else {
      bindEyeToggle('rEyeBtn', 'rPw');
      bindEyeToggle('rEyeBtn2', 'rPwConfirm');
      document.getElementById('registerForm').addEventListener('submit', handleRegister);
      document.getElementById('rName').addEventListener('input', () => clearErr('rName','nameErr'));
      document.getElementById('rEmail').addEventListener('input', () => clearErr('rEmail','rEmailErr'));
      document.getElementById('rPw').addEventListener('input', () => clearErr('rPw','rPwErr'));
      document.getElementById('rPwConfirm').addEventListener('input', () => clearErr('rPwConfirm','rPwConfirmErr'));
    }
  }

  function bindEyeToggle(btnId, inputId) {
    let visible = false;
    document.getElementById(btnId).addEventListener('click', () => {
      visible = !visible;
      document.getElementById(inputId).type = visible ? 'text' : 'password';
      document.getElementById(btnId).innerHTML = visible ? EYEOFF : EYE;
    });
  }

  // ═══════════════════════════════════════════════
  // VALIDATION HELPERS
  // ═══════════════════════════════════════════════
  function showErr(inputId, errId, msg) {
    document.getElementById(inputId)?.classList.add('err');
    const el = document.getElementById(errId);
    if (el) { el.textContent = '⚠ ' + msg; el.style.display = 'flex'; }
  }

  function clearErr(inputId, errId) {
    document.getElementById(inputId)?.classList.remove('err');
    const el = document.getElementById(errId);
    if (el) el.style.display = 'none';
  }

  function showApiErr(msg) {
    document.getElementById('apiErrText').textContent = msg;
    document.getElementById('apiErr').style.display = 'flex';
  }

  // Password strength indicator
  function updateStrength(val) {
    const fill = document.getElementById('pwStrengthFill');
    if (!fill) return;
    let score = 0;
    if (val.length >= 6)  score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const levels = [
      { pct: '20%', color: '#f47070' },
      { pct: '40%', color: '#f4a04c' },
      { pct: '60%', color: '#f4d94c' },
      { pct: '80%', color: '#6ac96a' },
      { pct: '100%', color: '#00E5A0' },
    ];
    const lvl = levels[Math.min(score-1, 4)] || { pct: '0%', color: 'transparent' };
    fill.style.width = lvl.pct;
    fill.style.background = lvl.color;
  }

  // ═══════════════════════════════════════════════
  // LOGIN HANDLER
  // ═══════════════════════════════════════════════
  async function handleLogin(e) {
    e.preventDefault();
    document.getElementById('apiErr').style.display = 'none';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    let valid = true;

    if (!email) { showErr('email','emailErr','Email obrigatório.'); valid = false; }
    else if (!/\S+@\S+\.\S+/.test(email)) { showErr('email','emailErr','Email inválido.'); valid = false; }
    if (!password) { showErr('password','pwErr','Senha obrigatória.'); valid = false; }
    else if (password.length < 6) { showErr('password','pwErr','Mínimo 6 caracteres.'); valid = false; }
    if (!valid) return;

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';

    // Simulate API — replace with real auth
    await new Promise(r => setTimeout(r, 1200));

    if (email === 'demo@foresail.io' && password === '123456') {
      showSuccess('loginCard', 'Login realizado!', 'Redirecionando para o dashboard...');
    } else {
      showApiErr('Credenciais inválidas. Use demo@foresail.io / 123456');
      btn.disabled = false;
      btn.innerHTML = 'Entrar';
    }
  }

  // ═══════════════════════════════════════════════
  // REGISTER HANDLER
  // ═══════════════════════════════════════════════
  async function handleRegister(e) {
    e.preventDefault();
    document.getElementById('apiErr').style.display = 'none';

    const name    = document.getElementById('rName').value.trim();
    const email   = document.getElementById('rEmail').value.trim();
    const pw      = document.getElementById('rPw').value;
    const pwConf  = document.getElementById('rPwConfirm').value;
    let valid = true;

    if (!name) { showErr('rName','nameErr','Nome obrigatório.'); valid = false; }
    if (!email) { showErr('rEmail','rEmailErr','Email obrigatório.'); valid = false; }
    else if (!/\S+@\S+\.\S+/.test(email)) { showErr('rEmail','rEmailErr','Email inválido.'); valid = false; }
    if (!pw) { showErr('rPw','rPwErr','Senha obrigatória.'); valid = false; }
    else if (pw.length < 6) { showErr('rPw','rPwErr','Mínimo 6 caracteres.'); valid = false; }
    if (!pwConf) { showErr('rPwConfirm','rPwConfirmErr','Confirme sua senha.'); valid = false; }
    else if (pw !== pwConf) { showErr('rPwConfirm','rPwConfirmErr','Senhas não coincidem.'); valid = false; }
    if (!valid) return;

    const btn = document.getElementById('rSubmitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';

    // Simulate API — replace with real auth (e.g. supabase.auth.signUp)
    await new Promise(r => setTimeout(r, 1400));

    showSuccess('registerCard', 'Conta criada!', 'Bem-vindo ao Foresail, ' + name.split(' ')[0] + '!');
  }

  // ═══════════════════════════════════════════════
  // SUCCESS OVERLAY
  // ═══════════════════════════════════════════════
  function showSuccess(cardId, title, sub) {
    const card = document.getElementById(cardId);
    const overlay = document.createElement('div');
    overlay.className = 'success-overlay';
    overlay.innerHTML = `
      <div class="success-icon">${CHECK_ICON}</div>
      <p class="success-title">${title}</p>
      <p class="success-sub">${sub}</p>`;
    card.appendChild(overlay);
  }

  // ═══════════════════════════════════════════════
  // SOCIAL LOGIN (placeholders)
  // ═══════════════════════════════════════════════
  function socialLogin(provider) {
    // Integrate: supabase.auth.signInWithOAuth({ provider })
    const labels = { google: 'Google', github: 'GitHub' };
    showApiErr?.(`Integrar OAuth ${labels[provider]} aqui`);
  }

  // ═══════════════════════════════════════════════
  // INITIAL RENDER
  // ═══════════════════════════════════════════════
  renderPage('login');
  document.getElementById('pageView').classList.add('page-enter');
  setTimeout(() => document.getElementById('pageView').classList.remove('page-enter'), 500);
  </script>
